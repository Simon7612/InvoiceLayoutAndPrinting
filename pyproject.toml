[project]
name = "invoicelayoutandprinting"
version = "0.1.0"
description = "发票排版与打印：将多张 PDF/OFD/XML 发票按 N-up 布局合成、预览并打印的 Windows 桌面工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "easyofd>=0.5.6",
    "nuitka>=2.8.6",
    "numpy>=2.5.3",
    "ofdparser>=0.0.8",
    "pypdf>=3.9",
    "pyqt6>=6.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
