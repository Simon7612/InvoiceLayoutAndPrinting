name: Test and Release (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 默认最小权限；release job 单独提升为 contents: write（创建标签与 Release 必需）
permissions:
  contents: read

jobs:
  # 每次 push/PR 都跑：uv sync 按 pyproject 安装全量依赖（含 ofdparser/easyofd/numpy），
  # 保证测试与冒烟覆盖真实 OFD/XML 功能
  test:
    runs-on: windows-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Run basic import test (smoke test)
        run: uv run python -c "import gui, pipeline, layoutInvoice, printInvoice, readInvoice; print('All modules imported successfully')"

  # 发版由 pyproject 驱动：version 变更合入 main 后自动打 v{version} 标签并发布；
  # 版本未变（同名 Release 已存在）时只跑 test，不重复发布
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read version from pyproject
        id: ver
        shell: pwsh
        run: |
          $v = uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Skip if version already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # gh 对"Release 不存在"返回退出码 1，这是预期分支；
          # runner 会在 pwsh 脚本末尾追加 exit $LASTEXITCODE，必须显式 exit 0
          gh release view "v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "v$env:VERSION 已发布，跳过构建"
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "v$env:VERSION 未发布，继续构建"
          }
          exit 0

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: uv sync

      - name: Build executable with Nuitka
        if: steps.check.outputs.exists == 'false'
        shell: cmd
        run: |
          uv run python -m nuitka ^
            --onefile ^
            --windows-console-mode=disable ^
            --enable-plugin=pyqt6 ^
            --windows-icon-from-ico=icon.ico ^
            --product-version=${{ steps.ver.outputs.version }} ^
            --file-version=${{ steps.ver.outputs.version }} ^
            --include-package=PyQt6 ^
            --output-dir=dist ^
            --assume-yes-for-downloads ^
            main.py

      - name: Rename output to expected name
        if: steps.check.outputs.exists == 'false'
        run: ren main.exe "发票排版与打印.exe"
        working-directory: ./dist

      - name: Upload artifact (for debugging or reuse)
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/发票排版与打印.exe

      # 标签不存在时由本步骤自动创建（指向当前构建的 commit），失败重跑可自愈
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 发票排版与打印 v${{ steps.ver.outputs.version }}
          files: dist/发票排版与打印.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
